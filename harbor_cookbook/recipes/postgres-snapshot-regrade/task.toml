schema_version = "1.1"

# Collect the file from the database service, not the agent container.
artifacts = [{ source = "/snapshot/state.json", service = "database" }]

[task]
name = "cookbook/postgres-snapshot-regrade"
description = "Capture PostgreSQL state, grade it in a separate verifier, and regrade the recorded snapshot."
keywords = ["postgresql", "docker-compose", "artifacts", "separate-verifier", "regrade"]

[metadata]
difficulty = "easy"
category = "example"
tags = ["postgresql", "artifacts", "regrade"]

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

# Harbor stops the main container before running sidecar collect hooks.
# This script uses a local socket and cannot be edited by the agent's DB role.
[[verifier.collect]]
service = "database"
command = "/usr/local/bin/capture-state"
user = "postgres"
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
